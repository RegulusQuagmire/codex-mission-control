name: Offline Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,dev]" pip-audit
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check dependency advisories
        run: python -m pip_audit --skip-editable
      - name: Compile
        run: python -m compileall -q src tests
      - name: Offline regression suite
        run: python -m pytest -q
      - name: Scan history for secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          $scanner = Join-Path $env:RUNNER_TEMP 'gitleaks'
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $zip
          $expected = 'D29144DEFF3A68AA93CED33DDDF84B7FDC26070ADD4AA0F4513094C8332AFC4E'
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $expected) { throw 'Scanner checksum mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath $scanner
          & "$scanner/gitleaks.exe" git . --redact --no-banner
          if ($LASTEXITCODE -ne 0) { throw 'Secret scan failed' }

  release-smoke:
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install offline QA dependencies
        run: python -m pip install -e ".[desktop,dev]"
      - name: Acquire pinned portable release tools
        shell: pwsh
        run: ./tools/bootstrap_release.ps1 -Output "$env:RUNNER_TEMP/release-tools"
      - name: Build and audit candidate and source distribution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tools=Get-Content "$env:RUNNER_TEMP/release-tools/tools.json" -Raw | ConvertFrom-Json
          & $tools.python tools/build_release.py --output "$env:RUNNER_TEMP/candidate" --iscc $tools.iscc --wheelhouse $tools.wheelhouse --runtime-archive $tools.runtimeArchive --sqlite-archive $tools.sqliteArchive
          if ($LASTEXITCODE -ne 0) { throw 'Audited build failed' }
          & $tools.python -c "import setuptools.build_meta as b; b.build_sdist(r'$env:RUNNER_TEMP/sdist')"
          if ($LASTEXITCODE -ne 0) { throw 'Source distribution build failed' }
          $source=Get-ChildItem "$env:RUNNER_TEMP/sdist/*.tar.gz" | Select-Object -First 1
          & $tools.python tools/source_audit.py $source.FullName "$env:RUNNER_TEMP/source-manifest.json"
          if ($LASTEXITCODE -ne 0) { throw 'Source distribution audit failed' }
      - name: Isolated synthetic install upgrade repair run uninstall
        shell: pwsh
        run: |
          $tools=Get-Content "$env:RUNNER_TEMP/release-tools/tools.json" -Raw | ConvertFrom-Json
          ./tools/windows_release_smoke.ps1 -Candidate "$env:RUNNER_TEMP/candidate" -QaPython (Get-Command python).Source -BuildPython $tools.python -Iscc $tools.iscc -Output "$env:RUNNER_TEMP/lifecycle"
          'Synthetic lifecycle smoke passed. Runner has development tools; independent clean Windows is NOT tested. No installer artifact is uploaded.' >> $env:GITHUB_STEP_SUMMARY
