name: Offline Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,dev]" pip-audit
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check dependency advisories
        run: python -m pip_audit --skip-editable
      - name: Compile
        run: python -m compileall -q src tests
      - name: Offline regression suite
        run: python -m pytest -q
      - name: Scan history for secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          $scanner = Join-Path $env:RUNNER_TEMP 'gitleaks'
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $zip
          $expected = 'D29144DEFF3A68AA93CED33DDDF84B7FDC26070ADD4AA0F4513094C8332AFC4E'
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $expected) { throw 'Scanner checksum mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath $scanner
          & "$scanner/gitleaks.exe" git . --redact --no-banner
          if ($LASTEXITCODE -ne 0) { throw 'Secret scan failed' }
